<style>
html,body{margin:0;height:100%;background:#0c0f14;display:flex;align-items:center;justify-content:center;

#gate{text-align:center;color:#fff;padding:20px;}

</div>
<div id="touchlayer"></div>
<div class="atkbtn" id="atkL" style="left:14px;bottom:96px;border-color:#4f9ad6;color:#4f9ad6;">拳</div>
<div class="atkbtn" id="atkR" style="right:14px;bottom:96px;border-color:#e0533f;color:#e0533f;">拳</div>
<script>
"use strict";
var KEYS = {
  L: {u:['w','KeyW',87], d:['s','KeyS',83], l:['a','KeyA',65], r:['d','KeyD',68], atk:['f','KeyF',70]},
  R: {u:['ArrowUp','ArrowUp',38], d:['ArrowDown','ArrowDown',40],
      l:['ArrowLeft','ArrowLeft',37], r:['ArrowRight','ArrowRight',39], atk:['.','Period',190]}
};
var TALK = [' ','Space',32];
function fire(type, spec) {
  var ev = new KeyboardEvent(type, {key:spec[0], code:spec[1], bubbles:true, cancelable:true});
  try {
    Object.defineProperty(ev, 'keyCode', {get:function(){return spec[2];}});
    Object.defineProperty(ev, 'which',  {get:function(){return spec[2];}});
  } catch(e) {}
  document.dispatchEvent(ev);
  window.dispatchEvent(new KeyboardEvent(type, {key:spec[0], code:spec[1], bubbles:true}));
}
function tapKey(spec) { fire('keydown', spec); setTimeout(function(){fire('keyup', spec);}, 80); }

var sticks = {};   // touchId -> {side, ox, oy, held:{u,d,l,r}, ring, knob, t0, moved}
function setDir(st, name, on) {
  if (st.held[name] === on) return;
  st.held[name] = on;
  fire(on ? 'keydown' : 'keyup', KEYS[st.side][name]);
}
function releaseAll(st) {
  ['u','d','l','r'].forEach(function(n){ if (st.held[n]) setDir(st, n, false); });
}
function mkVis(x, y, side) {
  var ring = document.createElement('div');
  ring.className = 'stickring';
  ring.style.borderColor = side === 'L' ? '#4f9ad6' : '#e0533f';
  ring.style.left = x + 'px'; ring.style.top = y + 'px';
  var knob = document.createElement('div');
  knob.className = 'stickknob';
  knob.style.left = x + 'px'; knob.style.top = y + 'px';
  document.body.appendChild(ring); document.body.appendChild(knob);
  return [ring, knob];
}
function inBtn(el, x, y) {
  var r = el.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  return (x - cx) * (x - cx) + (y - cy) * (y - cy) < 48 * 48;
}
function onTS(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var side = t.clientX < innerWidth / 2 ? 'L' : 'R';
    if (inBtn(document.getElementById('atkL'), t.clientX, t.clientY)) { tapKey(KEYS.L.atk); continue; }
    if (inBtn(document.getElementById('atkR'), t.clientX, t.clientY)) { tapKey(KEYS.R.atk); continue; }
    var vis = mkVis(t.clientX, t.clientY, side);
    sticks[t.identifier] = {side:side, ox:t.clientX, oy:t.clientY,
      held:{}, ring:vis[0], knob:vis[1], t0:Date.now(), moved:false};
  }
}
function onTM(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var st = sticks[t.identifier];
    if (!st) continue;
    var dx = t.clientX - st.ox, dy = t.clientY - st.oy;
    if (dx * dx + dy * dy > 144) st.moved = true;
    st.knob.style.left = t.clientX + 'px'; st.knob.style.top = t.clientY + 'px';
    setDir(st, 'l', dx < -14); setDir(st, 'r', dx > 14);
    setDir(st, 'u', dy < -14); setDir(st, 'd', dy > 14);
  }
}
function onTE(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var st = sticks[t.identifier];
    if (!st) continue;
    releaseAll(st);
    st.ring.remove(); st.knob.remove();
    if (!st.moved && Date.now() - st.t0 < 260) tapKey(TALK);   // 轻点=对话/继续
    delete sticks[t.identifier];
  }
}
